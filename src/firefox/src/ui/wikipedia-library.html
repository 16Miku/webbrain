<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="wl.page_title"></title>
  <script src="theme-bootstrap.js"></script>
  <link rel="stylesheet" href="wikipedia-library.css">
  <link rel="stylesheet" href="apocalypse-kit.css">
  <link rel="stylesheet" href="apocalypse-comm.css">
  <link rel="stylesheet" href="download-tracker.css">
</head>
<body class="wikipedia-library-page">
  <header class="topbar">
    <a class="back-button" href="emergency-box.html" data-i18n-aria-label="wl.back">←</a>
    <span class="archive-mark" aria-hidden="true">W</span>
    <div class="title-block">
      <h1 data-i18n="wl.title"></h1>
      <p data-i18n="wl.subtitle"></p>
    </div>
    <span id="mode-status" class="mode-status" data-kind="disabled" role="status" aria-live="polite"></span>
  </header>

  <main class="source-shell">
    <section class="source-card" aria-labelledby="source-title">
      <div class="source-heading">
        <p class="eyebrow" data-i18n="wl.eyebrow"></p>
        <h2 id="source-title" data-i18n="wl.choose_title"></h2>
        <p class="source-description" data-i18n="wl.choose_desc"></p>
      </div>

      <form id="source-form">
        <label class="language-field">
          <span data-i18n="wl.language"></span>
          <select id="language"></select>
        </label>

        <fieldset class="edition-fieldset">
          <legend data-i18n="wl.edition"></legend>
          <label class="edition-choice">
            <input type="radio" name="edition" value="text" checked>
            <span class="edition-copy">
              <strong data-i18n="wl.text_title"></strong>
              <small data-i18n="wl.text_desc"></small>
            </span>
            <span class="edition-symbol" aria-hidden="true">Aa</span>
          </label>
          <label class="edition-choice">
            <input type="radio" name="edition" value="images">
            <span class="edition-copy">
              <strong data-i18n="wl.images_title"></strong>
              <small data-i18n="wl.images_desc"></small>
            </span>
            <span class="edition-symbol image-symbol" aria-hidden="true"></span>
          </label>
        </fieldset>

        <button id="download" class="download-button" type="submit" data-i18n="wl.download"></button>
      </form>

      <section class="import-source" aria-labelledby="import-title">
        <div class="import-heading">
          <div>
            <h3 id="import-title" data-i18n="ap.import.title"></h3>
            <p data-i18n="ap.import.desc"></p>
          </div>
          <span class="import-mark" aria-hidden="true">ZIM</span>
        </div>
        <div class="import-controls">
          <label class="import-language-field">
            <span data-i18n="ap.language"></span>
            <select id="import-language"></select>
          </label>
          <input id="import-file" type="file" accept=".zim,application/x-zim" hidden>
          <button id="import-button" type="button" data-i18n="ap.import.button"></button>
          <button id="cancel-import" class="danger" type="button" data-i18n="ap.cancel" hidden></button>
        </div>
      </section>

      <p id="replacement-note" class="replacement-note" data-i18n="wl.replacement_note"></p>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <section id="current-source" class="current-source" data-i18n-aria-label="wl.current" hidden>
        <p class="eyebrow" data-i18n="wl.current"></p>
        <div id="archive-list" class="archive-list"></div>
      </section>
    </section>
  </main>

  <script type="module" src="apocalypse-comm.js"></script>
  <script type="module" src="download-tracker.js"></script>
  <script type="module" src="wikipedia-library.js"></script>
</body>
</html>
