<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebBrain Providers</title>
  <!-- Theme bootstrap — runs before the stylesheet so data-theme is set before any
       paint. External classic script because MV3's default CSP forbids
       inline scripts (same reason settings-tabs.js is external). -->
  <script src="theme-bootstrap.js"></script>
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="download-tracker.css">
</head>
<body>
  <div class="header-row">
    <div>
      <h1><img class="brand-mark" src="../../icons/icon128.png" alt="" aria-hidden="true"><a id="settings-title-link" href="#" data-i18n="st.providers_page.title"></a></h1>
      <p class="subtitle" id="subtitle" data-subtitle-key="st.providers_page.subtitle"></p>
    </div>
    <div class="header-actions">
      <a id="settings-page-link" class="support-link" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="sp.btn.settings"></span>
      </a>
      <a class="support-link" href="https://webbrain.one/docs" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        Support
      </a>
    </div>
  </div>

  <nav class="tabs" role="tablist" data-default-tab="llm" data-storage-key="webbrainProvidersTab" data-tab-aliases='{"providers":"llm","multimodal":"vision"}'>
    <button class="tab-btn active" type="button" role="tab" data-tab="llm" data-i18n="st.tab.llm"></button>
    <button class="tab-btn" type="button" role="tab" data-tab="vision" data-i18n="st.tab.vision"></button>
    <button class="tab-btn" type="button" role="tab" data-tab="speech" data-i18n="st.tab.speech"></button>
    <button class="tab-btn" type="button" role="tab" data-tab="generative" data-i18n="st.tab.generative"></button>
    <button class="tab-btn" type="button" role="tab" data-tab="decision" data-i18n="st.tab.decision"></button>
    <button class="tab-btn" type="button" role="tab" data-tab="safesocial" data-i18n="st.tab.safesocial"></button>
  </nav>

  <section class="tab-panel active" data-panel="llm" role="tabpanel">
    <div id="providers"></div>

    <div class="info-box" data-i18n-html="st.providers.info.html"></div>
  </section>

  <section class="tab-panel" data-panel="vision" role="tabpanel">
    <h3 class="mm-section-heading">
      <svg class="mm-section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span data-i18n="st.vision.heading"></span>
    </h3>
    <div class="provider-card" id="vision-card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.5;" data-i18n="st.vision.desc"></div>
      <div class="vision-local-option" id="webgpu-vision-option">
        <div class="vision-local-iris" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
            <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="vision-local-main">
          <div class="vision-local-heading">
            <strong id="webgpu-vision-choice-label" data-i18n="st.vision.local.title"></strong>
            <span class="vision-local-kicker">IN-BROWSER</span>
          </div>
          <div class="vision-local-desc" id="webgpu-vision-choice-desc" data-i18n="st.vision.local.desc"></div>
          <div class="vision-local-controls">
            <select id="webgpu-vision-choice" aria-labelledby="webgpu-vision-choice-label" aria-describedby="webgpu-vision-choice-desc webgpu-vision-status">
              <option value="auto" data-i18n="st.vision.local.choice.auto"></option>
              <option value="compass-vld" data-i18n="st.vision.local.choice.compass_vld"></option>
              <option value="bonsai" data-i18n="st.vision.local.choice.bonsai"></option>
              <option value="webbrain-vl" data-i18n="st.vision.local.choice.webbrain_vl"></option>
              <option value="off" data-i18n="st.vision.local.choice.off"></option>
            </select>
            <button class="btn-secondary vision-local-action" id="btn-use-webgpu-vision" type="button" hidden data-i18n="st.vision.local.download"></button>
          </div>
          <div class="vision-local-status" id="webgpu-vision-status" role="status" aria-live="polite"></div>
        </div>
      </div>
      <div class="vision-endpoint-divider"><span data-i18n="st.vision.endpoint_alternative"></span></div>
      <fieldset class="vision-endpoint-fields" id="vision-endpoint-fields">
      <div class="field">
        <label class="mm-field-label">
          <span data-i18n="st.provider.field.api_base_url"></span>
          <span class="mm-detected-provider" id="vision-detected" hidden>
            <img class="provider-icon" id="vision-detected-icon" alt="" width="16" height="16" decoding="async" draggable="false">
            <span id="vision-detected-label"></span>
          </span>
        </label>
        <input type="text" id="vision-base-url" placeholder="https://api.openai.com/v1">
      </div>
      <div class="field">
        <label data-i18n="st.provider.field.api_key"></label>
        <input type="password" id="vision-api-key" placeholder="sk-...">
      </div>
      <div class="field">
        <label data-i18n="st.provider.field.model"></label>
        <input type="text" id="vision-model" placeholder="gpt-4o">
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-save-vision" data-i18n="st.vision.save"></button>
      </div>
      </fieldset>
      <div class="btn-row vision-test-actions">
        <button class="btn-secondary" id="btn-test-vision" data-i18n="st.vision.test"></button>
        <button class="btn-secondary" id="btn-clear-vision" data-i18n="st.vision.clear"></button>
      </div>
      <div class="test-result" id="test-vision"></div>
    </div>
  </section>

  <section class="tab-panel" data-panel="speech" role="tabpanel">
    <h3 class="mm-section-heading">
      <svg class="mm-section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      <span data-i18n="st.transcription.heading"></span>
    </h3>
    <div class="provider-card" id="transcription-card">
      <div style="font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.5;" data-i18n="st.transcription.desc"></div>
      <div class="field">
        <label class="mm-field-label">
          <span data-i18n="st.provider.field.api_base_url"></span>
          <span class="mm-detected-provider" id="transcription-detected" hidden>
            <img class="provider-icon" id="transcription-detected-icon" alt="" width="16" height="16" decoding="async" draggable="false">
            <span id="transcription-detected-label"></span>
          </span>
        </label>
        <input type="text" id="transcription-base-url" placeholder="https://api.openai.com/v1">
      </div>
      <div class="field">
        <label data-i18n="st.provider.field.api_key"></label>
        <input type="password" id="transcription-api-key" placeholder="sk-...">
      </div>
      <div class="field">
        <label data-i18n="st.provider.field.model"></label>
        <input type="text" id="transcription-model" placeholder="whisper-1">
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-save-transcription" data-i18n="st.transcription.save"></button>
        <button class="btn-secondary" id="btn-test-transcription" data-i18n="st.transcription.test"></button>
        <button class="btn-secondary" id="btn-clear-transcription" data-i18n="st.transcription.clear"></button>
      </div>
      <div class="test-result" id="test-transcription"></div>
    </div>
  </section>

  <section class="tab-panel" data-panel="generative" role="tabpanel">
    <h3 class="mm-section-heading" id="image-gen-heading">
      <svg class="mm-section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span data-i18n="st.imagegen.heading"></span>
    </h3>
    <div class="provider-card" id="image-gen-card" aria-labelledby="image-gen-heading">
      <div style="font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.5;" data-i18n="st.imagegen.desc"></div>
      <div class="field">
        <label for="image-gen-provider" data-i18n="st.imagegen.provider"></label>
        <select id="image-gen-provider">
          <option value="fal">fal.ai</option>
          <option value="openrouter">OpenRouter</option>
          <option value="comfyrouter">Comfy Router</option>
          <option value="comfyui" data-i18n="st.imagegen.local_provider">ComfyUI (localhost)</option>
        </select>
      </div>
      <div class="field" id="image-gen-key-field">
        <label for="image-gen-api-key" data-i18n="st.provider.field.api_key"></label>
        <input type="password" id="image-gen-api-key" placeholder="FAL_KEY" autocomplete="off">
      </div>
      <div class="field" id="image-gen-model-field">
        <label for="image-gen-model" data-i18n="st.imagegen.image_model"></label>
        <input type="text" id="image-gen-model" placeholder="fal-ai/flux/schnell">
      </div>
      <div class="field" id="image-gen-parameters-field" hidden>
        <label for="image-gen-parameters" data-i18n="st.imagegen.parameters"></label>
        <textarea id="image-gen-parameters" rows="4" spellcheck="false" placeholder='{"prompt":"{{prompt}}"}'></textarea>
      </div>
      <div class="field" id="image-gen-video-model-field">
        <label for="image-gen-video-model" data-i18n="st.imagegen.video_model"></label>
        <input type="text" id="image-gen-video-model" placeholder="xai/grok-imagine-video/v1.5/lite/text-to-video">
      </div>
      <div class="field" id="image-gen-video-parameters-field" hidden>
        <label for="image-gen-video-parameters" data-i18n="st.imagegen.video_parameters"></label>
        <textarea id="image-gen-video-parameters" rows="4" spellcheck="false" placeholder='{"prompt":"{{prompt}}","duration":8}'></textarea>
      </div>
      <div class="field" id="image-gen-url-field" hidden>
        <label for="image-gen-base-url" data-i18n="st.provider.field.api_base_url"></label>
        <input type="url" id="image-gen-base-url" placeholder="http://127.0.0.1:8188">
      </div>
      <div class="field" id="image-gen-workflow-field" hidden>
        <label for="image-gen-workflow" data-i18n="st.imagegen.workflow"></label>
        <textarea id="image-gen-workflow" rows="8" spellcheck="false" placeholder='{"6":{"class_type":"CLIPTextEncode","inputs":{"text":"{{prompt}}"}}}'></textarea>
      </div>
      <div class="field" id="image-gen-video-workflow-field" hidden>
        <label for="image-gen-video-workflow" data-i18n="st.imagegen.video_workflow"></label>
        <textarea id="image-gen-video-workflow" rows="6" spellcheck="false" placeholder='{"6":{"class_type":"CLIPTextEncode","inputs":{"text":"{{prompt}}"}}}'></textarea>
      </div>
      <div style="font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:12px;">
        <span id="image-gen-provider-hint"></span>
        <a id="image-gen-docs" href="https://fal.ai/dashboard/keys" target="_blank" rel="noopener noreferrer" data-i18n="st.imagegen.setup"></a>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-save-image-gen" data-i18n="st.transcription.save"></button>
        <button class="btn-secondary" id="btn-test-image-gen" data-i18n="st.transcription.test"></button>
        <button class="btn-secondary" id="btn-clear-image-gen" data-i18n="st.transcription.clear"></button>
      </div>
      <div class="test-result" id="test-image-gen" role="status"></div>
    </div>
  </section>

  <section class="tab-panel" data-panel="decision" role="tabpanel">
    <h3 class="mm-section-heading" id="system-one-heading">
      <svg class="mm-section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="m8 12 3 3 5-6"/>
      </svg>
      <span data-i18n="st.system_one.title"></span>
    </h3>
    <div class="provider-card" id="system-one-card" aria-labelledby="system-one-heading">
      <p class="decision-intro" data-i18n="st.decision.intro"></p>

      <fieldset class="decision-mode" id="decision-mode" aria-describedby="decision-mode-desc">
        <legend class="decision-mode-legend" data-i18n="st.decision.mode.label"></legend>
        <div class="decision-mode-options">
          <label class="decision-mode-option"><input type="radio" name="decision-mode" value="auto" checked><span data-i18n="st.decision.mode.auto"></span></label>
          <label class="decision-mode-option"><input type="radio" name="decision-mode" value="on"><span data-i18n="st.decision.mode.on"></span></label>
          <label class="decision-mode-option"><input type="radio" name="decision-mode" value="off"><span data-i18n="st.decision.mode.off"></span></label>
        </div>
      </fieldset>
      <p class="decision-mode-desc" id="decision-mode-desc">
        <span data-decision-mode-desc="auto" data-i18n="st.decision.mode.auto_desc"></span>
        <span data-decision-mode-desc="on" data-i18n="st.decision.mode.on_desc" hidden></span>
        <span data-decision-mode-desc="off" data-i18n="st.decision.mode.off_desc" hidden></span>
      </p>
      <div class="decision-status" id="decision-auto-status" role="status" aria-live="polite" hidden></div>

      <div class="decision-configured" id="decision-configured" hidden>
        <div class="field"><label for="decision-provider" data-i18n="st.decision.provider"></label>
          <select id="decision-provider"><option value="openrouter">OpenRouter</option><option value="typesafe">TypeSafe</option><option value="local" data-i18n="st.decision.local"></option><option value="webgpu_d1" data-i18n="st.d1.provider"></option><option value="webgpu_chat" data-i18n="st.decision.webgpu_chat"></option></select>
        </div>
          <p class="setting-desc decision-note" id="webgpu-decision-note" hidden data-i18n="st.decision.webgpu_chat_note"></p>
        <div id="d1-controls" hidden>
          <p class="setting-desc decision-note" data-i18n="st.d1.warning"></p>
          <label><input type="checkbox" id="d1-consent"> <span data-i18n="st.d1.consent"></span></label>
          <div class="btn-row" style="margin-top:10px;flex-wrap:wrap">
            <button class="btn-secondary" id="d1-load" data-d1-command="download" data-i18n="st.d1.download"></button>
            <button class="btn-secondary" data-d1-command="stop" data-i18n="st.d1.stop"></button>
            <button class="btn-secondary" data-d1-command="reset" data-i18n="st.d1.unload"></button>
            <button class="btn-secondary" data-d1-command="clear" data-i18n="st.d1.remove"></button>
          </div>
          <div class="test-result show" id="d1-status" role="status"></div>
        </div>
        <div class="field"><label for="decision-model" data-i18n="st.decision.model"></label>
          <input id="decision-model" list="decision-models" autocomplete="off"><datalist id="decision-models"></datalist>
          <button class="btn-secondary" id="btn-decision-models" data-i18n="st.decision.refresh"></button>
        </div>
        <div class="field" id="decision-endpoint-field"><label for="decision-endpoint" data-i18n="st.decision.endpoint"></label>
          <input id="decision-endpoint" type="url" placeholder="http://127.0.0.1:8009">
        </div>
        <div class="field">
          <label for="system-one-api-key" data-i18n="st.system_one.api_key.label"></label>
          <input type="password" id="system-one-api-key" placeholder="API key" autocomplete="off" spellcheck="false">
        </div>
        <div class="field"><label for="decision-vision" data-i18n="st.decision.vision"></label>
          <select id="decision-vision"><option value="auto" data-i18n="st.decision.auto"></option><option value="on" data-i18n="st.decision.on"></option><option value="off" data-i18n="st.decision.off"></option></select>
        </div>
        <p class="setting-desc decision-note" data-i18n="st.decision.compass"></p>

        <details class="advanced-settings decision-features" id="decision-features">
          <summary data-i18n="st.decision.features"></summary>
          <div class="advanced-settings-body">
            <p class="setting-desc decision-features-desc" data-i18n="st.decision.features_desc"></p>
            <div class="setting-row"><div class="setting-info"><div class="setting-label" data-i18n="st.decision.done"></div><div class="setting-desc" data-i18n="st.decision.done_desc"></div></div>
              <label class="toggle"><input type="checkbox" id="toggle-decision-done" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="field"><label for="decision-done-threshold" data-i18n="st.decision.threshold"></label>
              <input id="decision-done-threshold" type="number" min="50" max="99" step="1" value="90">
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label" data-i18n="st.system_one.watch.label"></div><div class="setting-desc" data-i18n="st.decision.watch_desc"></div></div>
              <label class="toggle"><input type="checkbox" id="toggle-system-one-watch" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="field">
              <label for="range-system-one-watch-threshold"><span data-i18n="st.system_one.watch_threshold"></span> <span id="system-one-watch-threshold-value">70%</span></label>
              <input type="range" id="range-system-one-watch-threshold" min="50" max="95" step="5" value="70">
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label" data-i18n="st.system_one.completion.label"></div><div class="setting-desc" data-i18n="st.decision.completion_desc"></div></div>
              <label class="toggle"><input type="checkbox" id="toggle-system-one-completion" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="field">
              <label for="range-system-one-completion-threshold"><span data-i18n="st.system_one.completion_threshold"></span> <span id="system-one-completion-threshold-value">70%</span></label>
              <input type="range" id="range-system-one-completion-threshold" min="50" max="95" step="5" value="70">
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label" data-i18n="st.system_one.fast_classifications"></div><div class="setting-desc" data-i18n="st.decision.classifications_desc"></div></div>
              <label class="toggle"><input type="checkbox" id="toggle-system-one-classifications" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="setting-row">
              <div class="setting-info"><div class="setting-label" data-i18n="st.system_one.fast_browser"></div><div class="setting-desc" data-i18n="st.decision.browser_desc"></div></div>
              <label class="toggle"><input type="checkbox" id="toggle-system-one-browser" checked><span class="toggle-slider"></span></label>
            </div>
          </div>
        </details>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-save-system-one" data-i18n="st.providers.save" hidden></button>
        <button class="btn-secondary" id="btn-test-system-one" data-i18n="st.providers.test"></button>
        <button class="btn-secondary" id="btn-clear-system-one" data-i18n="st.decision.reset"></button>
      </div>
      <div class="test-result" id="test-system-one"></div>

      <div class="info-box" style="margin-top:16px;" data-i18n-html="st.system_one.security_html"></div>
    </div>
  </section>

  <section class="tab-panel" data-panel="safesocial" role="tabpanel">
    <h3 id="safesocial-heading" class="mm-section-heading" data-i18n="st.safesocial.heading"></h3>
    <div class="provider-card" id="safesocial-card" aria-labelledby="safesocial-heading">
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label" id="safesocial-enable-label" data-i18n="st.safesocial.enable"></div>
          <div class="setting-desc" data-i18n="st.safesocial.desc"></div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="safesocial-enabled" aria-labelledby="safesocial-enable-label">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p class="setting-desc" data-i18n="st.safesocial.download"></p>
      <p class="setting-desc"><a href="https://huggingface.co/webbrain-one/safesocial-trigger-classifier-efficientnet-lite0" target="_blank" rel="noopener noreferrer" data-i18n="st.safesocial.model"></a></p>
      <div class="field">
        <label for="safesocial-action" data-i18n="st.safesocial.action"></label>
        <select id="safesocial-action">
          <option value="blur" data-i18n="st.safesocial.blur"></option>
          <option value="hide" data-i18n="st.safesocial.hide"></option>
          <option value="dim" data-i18n="st.safesocial.dim"></option>
          <option value="warn" data-i18n="st.safesocial.warn"></option>
        </select>
      </div>
      <div class="field">
        <label for="safesocial-threshold" data-i18n="st.safesocial.threshold"></label>
        <div style="display:flex;align-items:center;gap:12px;">
          <input id="safesocial-threshold" type="range" min="50" max="99" step="1" value="95" style="flex:1;min-width:0;">
          <output for="safesocial-threshold">95%</output>
        </div>
        <div class="setting-desc" data-i18n="st.safesocial.threshold_desc"></div>
      </div>
      <fieldset class="safesocial-labels-fieldset">
        <legend class="setting-label" data-i18n="st.safesocial.categories"></legend>
        <div id="safesocial-labels"></div>
      </fieldset>
      <p class="setting-desc" data-i18n="st.safesocial.scope"></p>
      <div id="safesocial-status" class="setting-desc" role="status" aria-live="polite"></div>
      <div class="btn-row" style="margin-top:12px;">
        <button type="button" class="btn-secondary" id="safesocial-retry" hidden data-i18n="st.safesocial.retry"></button>
        <button type="button" class="btn-secondary" id="safesocial-remove" data-i18n="st.safesocial.remove"></button>
      </div>
    </div>
  </section>

  <!-- Tab switcher must be an external script — Manifest V3's default
       CSP (`script-src 'self'`) blocks inline <script> execution. -->
  <script src="settings-tabs.js"></script>
  <script type="module" src="download-tracker.js"></script>
  <script src="settings.js" type="module"></script>
  <script src="safesocial-settings.js" type="module"></script>
</body>
</html>
