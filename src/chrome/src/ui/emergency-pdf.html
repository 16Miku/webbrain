<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="ep.page_title"></title>
  <script src="theme-bootstrap.js"></script>
  <link rel="stylesheet" href="emergency-pdf.css">
  <link rel="stylesheet" href="apocalypse-kit.css">
  <link rel="stylesheet" href="apocalypse-comm.css">
  <link rel="stylesheet" href="download-tracker.css">
</head>
<body class="emergency-pdf-page">
  <header class="reader-header">
    <a class="back-button" href="emergency-box.html" data-i18n-aria-label="ep.back">←</a>
    <span class="pdf-mark" aria-hidden="true">PDF</span>
    <div class="document-heading">
      <div class="document-title-row">
        <h1 id="document-title" data-i18n="ep.loading"></h1>
        <span id="offline-badge" class="document-offline-badge" data-i18n="ep.available_offline" hidden></span>
      </div>
      <a id="document-source" href="#" target="_blank" rel="noopener noreferrer" hidden><span data-i18n="ep.source"></span> ↗</a>
    </div>
    <button type="button" id="save-copy" class="header-button" disabled data-i18n="ep.save_copy" data-i18n-title="ep.export_tooltip"></button>
  </header>

  <div class="reader-toolbar" role="toolbar" data-i18n-aria-label="ep.toolbar">
    <div class="tool-group">
      <button type="button" id="previous-page" data-i18n-aria-label="ep.previous" disabled>←</button>
      <label class="page-control">
        <span data-i18n="ep.page"></span>
        <input id="page-number" type="number" min="1" value="1" disabled>
        <span>/ <strong id="page-count">—</strong></span>
      </label>
      <button type="button" id="next-page" data-i18n-aria-label="ep.next" disabled>→</button>
    </div>
    <div class="tool-divider" aria-hidden="true"></div>
    <div class="tool-group">
      <button type="button" id="zoom-out" data-i18n-aria-label="ep.zoom_out" disabled>−</button>
      <button type="button" id="fit-width" class="text-button" disabled data-i18n="ep.fit_width"></button>
      <button type="button" id="zoom-in" data-i18n-aria-label="ep.zoom_in" disabled>＋</button>
    </div>
    <form id="search-form" class="document-search" role="search">
      <input id="document-search" type="search" data-i18n-placeholder="ep.search" disabled>
      <button type="submit" class="text-button" disabled data-i18n="ep.find"></button>
    </form>
    <button type="button" id="fullscreen" class="text-button" disabled data-i18n="ep.fullscreen"></button>
  </div>

  <main id="document-stage" class="document-stage">
    <div id="reader-message" class="reader-message" role="status" aria-live="polite">
      <span class="loading-ring" aria-hidden="true"></span>
      <span data-i18n="ep.preparing"></span>
    </div>
    <canvas id="pdf-canvas" data-i18n-aria-label="ep.canvas_label" hidden></canvas>
  </main>
  <footer id="reader-status" class="reader-status" role="status" aria-live="polite"></footer>
  <script type="module" src="apocalypse-comm.js"></script>
  <script type="module" src="download-tracker.js"></script>
  <script type="module" src="emergency-pdf.js"></script>
</body>
</html>
