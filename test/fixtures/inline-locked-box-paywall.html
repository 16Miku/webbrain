<!doctype html>
<html>
<head>
  <meta property="og:type" content="article">
  <title>Locked box paywall fixture</title>
  <style>
    body { margin: 0; font: 18px/1.5 sans-serif; }
    article { max-width: 700px; margin: 32px auto; }
  </style>
</head>
<body>
  <article>
    <h1>Locked box headline</h1>
    <!-- The wall's box holds the locked article right after its heading. -->
    <div class="paywall-container">
      <div class="paywall-box">
        <h2>Subscribe to continue reading</h2>
        <div class="locked-content"><p>SECRET_LOCKED The council voted on the breakwater late last night.</p></div>
      </div>
    </div>
  </article>
</body>
</html>
