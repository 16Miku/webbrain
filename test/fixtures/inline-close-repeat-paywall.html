<!doctype html>
<html>
<head>
  <meta property="og:type" content="article">
  <title>Close repeat paywall fixture</title>
  <style>
    body { margin: 0; font: 18px/1.5 sans-serif; }
    article { max-width: 700px; margin: 32px auto; }
    .paywall-wrapper { padding: 24px; border: 1px solid #aaa; }
  </style>
</head>
<body>
  <article>
    <h1>Close repeat headline</h1>
    <!-- A line that reads like the wall follows a short withheld sentence. -->
    <div class="paywall-wrapper">
      <p>VISIBLE_CLOSE_PREVIEW opens the story.</p>
      <h3>Subscribe to continue reading this article</h3>
      <p>SECRET_CLOSE_SHORT is a short withheld sentence.</p>
      <p>Already a subscriber? Log in to continue reading.</p>
      <p>SECRET_CLOSE_AFTER must not be returned either.</p>
    </div>
  </article>
</body>
</html>
